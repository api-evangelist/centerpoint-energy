note: >-
  Every probed path missed. www.centerpointenergy.com and centerpointenergy.com return a genuine 404 for
  all five discovery documents. energydataportal.centerpointenergy.com returns a bare 404 with no body.
  www.smartmetertexas.com and smartmetertexas.com return HTTP 200 with a 973-byte React SPA shell
  (<!doctype html><html lang="en">...) for EVERY /.well-known/* path including nonexistent ones — an SPA
  catch-all, NOT a served document, and recorded here as a miss. services.smartmetertexas.net does not
  answer an anonymous TLS handshake at all (mutual TLS required), so no anonymous probe is possible there.
  No WellKnown or SecurityTxt pointer is emitted from this file, because nothing was served.
