first_party_distribution:
  present: false
  note: >-
    The SMT Data Access Interface Guide distributes no code — integration is described in prose and the
    caller writes their own HTTPS client with a signed certificate. No sample client, Postman collection or
    reference implementation is published. No SDKs pointer is emitted in apis.yml, because a provider that
    ships no library must not be credited with one.
