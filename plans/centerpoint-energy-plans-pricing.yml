description: >-
  CenterPoint Energy publishes no API plans, no developer pricing page and no self-service sign-up for any
  machine-readable surface. Its integration surfaces are regulated or consortium-operated rather than
  commercially tiered: access to CenterPoint meter data through the Smart Meter Texas Data Access interface
  is granted by registration and an executed Energy Data Sharing Agreement at no published per-call charge,
  and the Competitive Retailers Information Portal is entitlement-based for retail electric providers
  already operating in the ERCOT market. What CenterPoint does publish as pricing is utility tariff — rate
  schedules filed with the Public Utility Commission of Texas for delivering energy, which price kilowatt
  hours, not API calls.
notes: >-
  This file replaces a 2026-05-04 bulk-sweep generated version whose third plan described a "Centerpoint
  Connect Services API (Partner)". That surface belongs to Centerpoint Connect, an unrelated commercial
  roofing CRM company at centerpointconnect.com, and has been removed rather than repriced. See the
  ownership note in apis.yml.
plan_count: 2
pricing_page_published: false
self_service_signup: false
plans:
  - id: centerpoint-energy-smt-data-access
    name: Smart Meter Texas Data Access (registered third party)
    type: free
    description: >-
      Registered entity access to CenterPoint Energy interval, register, billing, Green Button, meter and
      premise data for ESI IDs covered by an executed Energy Data Sharing Agreement. Onboarding is a
      registration and credentialing process — an SMT entity account, a signed API SSL certificate per
      entity and an ID/password pair per DUNS — not a purchase. No per-call price, metered charge or
      subscription fee is published for the interface.
    price: '0.00'
    currency: USD
    billing_period: null
    onboarding: registration + Energy Data Sharing Agreement
    self_service: false
    quota:
      on_demand_reads: 3000 per day per TDU (shared across all callers on that utility)
      other_functions: no published quota
    source: https://www.smartmetertexas.com/commonapi/gethelpguide/help-guides/Smart_Meter_Texas_Interface_Guide.pdf
  - id: centerpoint-energy-competitive-retailer-portal
    name: Competitive Retailers Information Portal
    type: entitlement
    description: >-
      24/7 portal access for retail electric providers operating on CenterPoint's Houston-area transmission
      and distribution network, covering market guides, metering data, usage history, TxSET transaction
      standards and forms. Access is requested rather than bought; no price is published because the
      relationship is governed by the retail delivery tariff rather than a product price list.
    price: not published
    currency: USD
    billing_period: null
    onboarding: request access
    self_service: false
    source: https://www.centerpointenergy.com/en-us/for-business/industry/competitive-retailers
related_pricing:
  - name: Tariff for Retail Delivery Service and rate schedules
    url: https://www.centerpointenergy.com/en-us/our-services/rates-tariffs
    note: >-
      Regulated delivery pricing filed with the PUCT — this is what CenterPoint charges for energy
      delivery, not for API access. Recorded so the distinction is explicit rather than conflated.
