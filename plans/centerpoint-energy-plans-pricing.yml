specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: CenterPoint Energy
providerId: centerpoint-energy
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Energy
  - Utility
  - Smart Meter
  - Green Button
  - Usage Data
description: CenterPoint Energy exposes three integration surfaces. The Smart Meter Texas (SMT) Usage
  History Inquiry API is operated by the Smart Meter Texas consortium for Texas TDSPs (CenterPoint participates
  as a member) — access requires SMT Third-Party Service Provider registration and is free to authorized
  TPSPs. Green Button Connect My Data follows the NAESB ESPI standard and is free to authorized third
  parties acting on customer consent. The Centerpoint Connect Services API at api-portal.centerpointconnect.io
  is a partner / contractor portal that gates products behind login; per-product pricing is not published
  publicly.
notes: SMT and Green Button are regulator / consortium-driven and free. Centerpoint Connect Services
  API requires login to view any product / pricing detail.
sources:
  - https://www.smartmetertexas.com/
  - https://www.smartmetertexas.com/developers
  - https://www.energy.gov/data/green-button
  - https://api-portal.centerpointconnect.io/
  - https://centerpointconnect.zendesk.com/hc/en-us/sections/16652143336855-API-Integrations
plans:
  - id: centerpoint-energy-smt-tpsp
    name: Smart Meter Texas Usage History Inquiry (TPSP)
    type: freemium
    description: Free authorized access to CenterPoint interval usage and billing history through the
      Smart Meter Texas consortium API. Requires SMT Third-Party Service Provider registration and customer-authorized
      account validation.
    entries:
      - label: TPSP API access
        name: smt_tpsp
        type: quota
        metric: request
        limit: -1
        timeFrame: usage
        geo: TX
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Account validation
      - name: Interval usage retrieval
      - name: Billing history retrieval
      - name: Customer-authorized access
  - id: centerpoint-energy-green-button
    name: Green Button Connect My Data
    type: freemium
    description: Free authorized export of a customer's interval energy usage in NAESB ESPI XML / Atom
      format, granted under the Green Button Connect My Data third-party authorization flow.
    entries:
      - label: ESPI Connect My Data
        name: green_button
        type: quota
        metric: request
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: NAESB ESPI standard
      - name: Customer-authorized OAuth flow
      - name: Interval usage download
  - id: centerpoint-energy-cpc-services-api
    name: Centerpoint Connect Services API (Partner)
    type: enterprise
    description: Partner / contractor integration surface for the Centerpoint Connect field-service and
      workflow platform. Pricing and per-product entitlements are gated behind portal login.
    entries:
      - label: Centerpoint Connect partner access
        name: cpc_partner
        type: subscription
        metric: contract
        limit: -1
        timeFrame: month
        geo: US
        unit: 1
        price: contact Centerpoint Connect partner team
        userMultiplied: false
    elements:
      - name: Services API
      - name: Automated Leads integration
      - name: Webhook flows
      - name: Contractor / field-service workflow
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
