meters:
  - name: smt_usage_inquiries
    unit: request
    aggregation: sum
    dimensions:
      - tpsp
      - account
  - name: green_button_authorizations
    unit: authorization
    aggregation: count
    dimensions:
      - third_party
  - name: interval_kwh_delivered
    unit: kWh
    aggregation: sum
    dimensions:
