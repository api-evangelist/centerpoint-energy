      - service_class
  - name: utility_invoiced_amount
    unit: USD
    aggregation: sum
    dimensions:
      - account
      - service_class
      - region
principles:
  - name: Visibility
    description: Pull SMT TPSP usage exports nightly to see authorized account interval data, and combine
      with the customer's CenterPoint utility bill to reconcile observed kWh with billed kWh.
  - name: Allocation
    description: Tag SMT and Green Button authorizations with the consuming product team and the customer's
      cost center so utility-data costs are allocated where the data drives business outcomes.
  - name: Optimization
    description: Use Green Button bulk authorization windows rather than continuous polling; align SMT
      requests with the overnight batch cadence; cache results that don't change intra-day.
  - name: Accountability
    description: Energy / facilities lead owns the utility bill; integration platform owner manages SMT
      TPSP registration and Green Button consent flows; and the retail delivery tariff governs the utility invoice itself.
