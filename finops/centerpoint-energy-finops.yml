description: 'FOCUS-aligned FinOps for CenterPoint Energy''s integration surfaces. The Smart Meter Texas
  Data Access and Green Button interfaces are free under regulator / consortium policy; the only invoice
  surface visible to an integrator is the underlying utility bill driven by metered consumption, priced by
  the regulated retail delivery tariff.'
notes: 'API access carries no published per-call charge; meters below track usage and invoice signals
  rather than API spend. Corrected 2026-09-05: a cpc_api_requests meter and a Centerpoint Connect partner
  contract were removed from this file — that surface belongs to Centerpoint Connect, an unrelated roofing
  CRM company, not to CenterPoint Energy.'
