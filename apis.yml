description: 'CenterPoint Energy is a domestic energy delivery company providing electric transmission
  and distribution, natural gas distribution and energy services to residential, commercial and industrial
  customers across Texas, Indiana, Minnesota, Ohio and Louisiana. Its machine-readable surfaces are B2B
  and regulator-driven rather than a public developer program: CenterPoint Energy Houston Electric is
  one of four Texas Transmission and Distribution Service Providers that jointly own and fund Smart Meter
  Texas, whose REST/SOAP interface at services.smartmetertexas.net serves 15-minute interval reads, daily
  register reads, monthly billing reads and NAESB ESPI Green Button exports to customer-authorized third
  parties over mutual TLS. CenterPoint also runs a Competitive Retailers Information Portal and publishes
  the TxSET (ANSI X12 EDI) transaction standards and SAC04 invoice codes retailers integrate against.'
