  description: NAESB ESPI (Energy Services Provider Interface) Green Button export of a CenterPoint Energy
    electric customer's 15-minute interval usage, delivered as an ad-hoc REST call to the /greenbutton/
    resource on the Smart Meter Texas Data Access interface and documented in section 3.1.1.4 of the SMT
    Interface Guide. Access requires an executed Energy Data Sharing Agreement and the same mutual-TLS
    + Basic credentials as the rest of the SMT surface. The Green Button standard itself is stewarded
    by NAESB and the Green Button Alliance; the CenterPoint-reachable implementation is the SMT endpoint.
  baseURL: https://services.smartmetertexas.net/greenbutton
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/centerpoint-energy.png
