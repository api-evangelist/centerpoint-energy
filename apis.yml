  description: Customer-authorized access to CenterPoint Energy interval usage, daily register reads,
    monthly billing reads, meter and premise attributes and on-demand reads, through the Smart Meter Texas
    (SMT) Data Access interface. SMT is jointly owned and funded by the four Texas TDSPs — CenterPoint
    Energy Houston Electric, Oncor, AEP Texas and TNMP — and is the surface CenterPoint's own competitive-retailer
    and customer documentation directs third parties to for CenterPoint meter data; the contract is published
    and operated by Smart Meter Texas, not by CenterPoint alone. REST and SOAP endpoints live at services.smartmetertexas.net
    (UAT at uatservices.smartmetertexas.net) behind mutual TLS plus HTTP Basic credentials issued per
    DUNS. No machine-readable OpenAPI/WSDL is published; the contract is a 185-page PDF interface guide.
  baseURL: https://services.smartmetertexas.net
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/centerpoint-energy.png
