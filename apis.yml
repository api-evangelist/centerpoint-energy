x-ownership-corrections:
  date: '2026-09-05'
  removed: centerpoint-energy:centerpoint-connect-services-api
  host: api-portal.centerpointconnect.io
  finding: STEP 0c ownership check. The Centerpoint API Developer Portal at api-portal.centerpointconnect.io
    belongs to Centerpoint Connect, a commercial roofing CRM company, not to CenterPoint Energy. Proved
    from the portal's own markup, which links its application at https://app.centerpointconnect.com/ and
    its contact page at https://centerpointconnect.com/contact/; centerpointconnect.com returns HTTP 200
    with the title "Roofing CRM Software | Centerpoint Connect" and the description "All-in-one software
    built for commercial roofers." The two companies share only a name. The API entry, its plans entry
    and its finops meter have been removed rather than repriced.
  evidence:
  - url: https://api-portal.centerpointconnect.io/
    status: 200
  - url: https://centerpointconnect.com/
    status: 200
