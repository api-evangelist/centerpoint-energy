# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: false
tags:
  - Energy
  - Utility
  - Smart Meter
  - Green Button
  - Rate Limiting
description: CenterPoint integration surfaces have different rate-limit ownership. Smart Meter Texas
  limits are set by the SMT consortium and surfaced to registered TPSPs in the SMT developer guide.
  Green Button Connect My Data limits follow the NAESB ESPI specification and the customer-authorization
  cadence. Centerpoint Connect Services API limits are documented in the partner Zendesk knowledge base
  and surface only after partner portal login.
notes: Numeric limits are not visible without Smart Meter Texas TPSP registration or Centerpoint Connect
  partner login.
sources:
  - https://www.smartmetertexas.com/developers
  - https://centerpointconnect.zendesk.com/hc/en-us/sections/16652143336855-API-Integrations
  - https://api-portal.centerpointconnect.io/
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: Smart Meter Texas TPSP throughput
    scope: TPSP-account
    metric: varies
    limit: see SMT TPSP developer guide
  - name: Green Button Connect My Data
    scope: third-party-authorization
    metric: varies
    limit: see NAESB ESPI guidance / customer authorization scope
  - name: Centerpoint Connect Services API
    scope: partner-account
    metric: varies
    limit: see Centerpoint Connect partner Zendesk
policies:
  - name: Customer authorization
    description: Smart Meter Texas and Green Button calls operate under explicit customer authorization;
      authorization scope and duration constrain usable request volume.
  - name: Backoff
    description: On 429 / 503, retry with exponential backoff and jitter; honor Retry-After when supplied.
  - name: Smart Meter Texas batch windows
    description: SMT bulk usage retrievals are designed around overnight / scheduled batch windows; high-frequency
      polling is discouraged and may be throttled.
